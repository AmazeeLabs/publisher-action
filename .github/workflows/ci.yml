name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm check

  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The runner executes dist/, so a dependency bump that only touches
      # pnpm-lock.yaml would otherwise ship the old code.
      - name: Verify dist/ matches src/ and the lockfile
        run: |
          pnpm package
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'pnpm package' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi
